# A checkout UI extension of the playground. Its bundle, dist/ui-contact-newsletter.js, is written by hand
# (no build step): read it for what the extension shows.
api_version = "2027-01"

[[extensions]]
name = "UI: contact newsletter"
handle = "ui-contact-newsletter"
type = "ui_extension"
description = "Under the contact: who the confirmation goes to, and a newsletter checkbox stored as a cart attribute."

  [[extensions.targeting]]
  target = "purchase.checkout.contact.render-after"
