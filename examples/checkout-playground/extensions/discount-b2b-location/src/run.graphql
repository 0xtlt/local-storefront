query Input {
  cart {
    lines {
      id
    }
    buyerIdentity {
      purchasingCompany {
        company {
          name
        }
        location {
          name
          externalId
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:config", key: "settings") {
      value
    }
  }
}
