# A checkout UI extension of the playground. Its bundle, dist/ui-broken-not-built.js, is written by hand
# (no build step): read it for what the extension shows.
api_version = "2026-10"

[[extensions]]
name = "UI broken: not-built"
handle = "ui-broken-not-built"
type = "ui_extension"
description = "Has no dist/ bundle: the server says to run shopify app build."

  [[extensions.targeting]]
  target = "purchase.checkout.block.render"

# Wrong on purpose: there is no dist/ui-broken-not-built.js, the bundle `shopify app build` writes.
