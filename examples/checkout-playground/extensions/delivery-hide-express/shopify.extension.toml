api_version = "2026-10"

[[extensions]]
name = "Hide express"
handle = "delivery-hide-express"
type = "function"
description = "Hides express delivery for some countries and for PO box addresses"

  [[extensions.targeting]]
  target = "cart.delivery-options.transform.run"
  input_query = "src/run.graphql"
  export = "cart_delivery_options_transform_run"

  [extensions.build]
  command = "../../../../tools/checkout/build_functions.sh ../.. delivery-hide-express"
  path = "dist/function.wasm"
  watch = ["src/**/*.rs"]
