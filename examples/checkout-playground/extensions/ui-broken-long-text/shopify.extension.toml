# A checkout UI extension of the playground. Its bundle, dist/ui-broken-long-text.js, is written by hand
# (no build step): read it for what the extension shows.
api_version = "2026-10"

[[extensions]]
name = "UI broken: long-text"
handle = "ui-broken-long-text"
type = "ui_extension"
description = "Long unbroken text in a banner, a badge, a button, a field and under each line."

  [[extensions.targeting]]
  target = "purchase.checkout.block.render"

  [[extensions.targeting]]
  target = "purchase.checkout.cart-line-item.render-after"
