api_version = "2026-10"

[[extensions]]
name = "Rename payment methods"
handle = "payment-rename"
type = "function"
description = "Renames payment methods"

  [[extensions.targeting]]
  target = "cart.payment-methods.transform.run"
  input_query = "src/run.graphql"
  export = "cart_payment_methods_transform_run"

  [extensions.build]
  command = "../../../../tools/checkout/build_functions.sh ../.. payment-rename"
  path = "dist/function.wasm"
  watch = ["src/**/*.rs"]
