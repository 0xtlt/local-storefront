# A checkout UI extension of the playground. Its bundle, dist/ui-broken-unknown-target.js, is written by hand
# (no build step): read it for what the extension shows.
api_version = "2026-10"

[[extensions]]
name = "UI broken: unknown-target"
handle = "ui-broken-unknown-target"
type = "ui_extension"
description = "Declares a target that does not exist and one the local checkout has no place for, next to the block target."

  [[extensions.targeting]]
  target = "purchase.checkout.nowhere.render"

  [[extensions.targeting]]
  target = "purchase.checkout.chat.render"

  [[extensions.targeting]]
  target = "purchase.checkout.block.render"
