api_version = "2026-10"

[[extensions]]
name = "Blocked countries"
handle = "validation-blocked-country"
type = "function"
description = "Refuses to ship to the countries of its settings"

  [[extensions.targeting]]
  target = "cart.validations.generate.run"
  input_query = "src/run.graphql"
  export = "cart_validations_generate_run"

  [extensions.build]
  command = "../../../../tools/checkout/build_functions.sh ../.. validation-blocked-country"
  path = "dist/function.wasm"
  watch = ["src/**/*.rs"]
