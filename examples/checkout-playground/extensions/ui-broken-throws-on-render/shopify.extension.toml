# A checkout UI extension of the playground. Its bundle, dist/ui-broken-throws-on-render.js, is written by hand
# (no build step): read it for what the extension shows.
api_version = "2026-10"

[[extensions]]
name = "UI broken: throws-on-render"
handle = "ui-broken-throws-on-render"
type = "ui_extension"
description = "Throws as soon as its target runs."

  [[extensions.targeting]]
  target = "purchase.checkout.block.render"
