# A checkout UI extension of the playground. Its bundle, dist/ui-broken-bad-owner-type.js, is written by hand
# (no build step): read it for what the extension shows.
api_version = "2027-01"

[[extensions]]
name = "UI broken: bad-owner-type"
handle = "ui-broken-bad-owner-type"
type = "ui_extension"
description = "Declares a metafield whose owner_type is not one of the eight: not loaded."

  [[extensions.targeting]]
  target = "purchase.checkout.block.render"

  # Wrong on purpose: COLLECTION is a metafield owner of the Admin API, not one a UI extension
  # can declare.
  [[extensions.metafields]]
  namespace = "$app:playground"
  key = "bad_owner"
  owner_type = "COLLECTION"
