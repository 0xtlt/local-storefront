# A checkout UI extension of the playground. Its bundle, dist/ui-broken-unregistered-target.js, is written by hand
# (no build step): read it for what the extension shows.
api_version = "2026-10"

[[extensions]]
name = "UI broken: unregistered-target"
handle = "ui-broken-unregistered-target"
type = "ui_extension"
description = "Declares the block target, but its bundle registers the footer target instead."

  [[extensions.targeting]]
  target = "purchase.checkout.block.render"
