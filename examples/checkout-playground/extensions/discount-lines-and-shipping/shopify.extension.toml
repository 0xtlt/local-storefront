api_version = "2027-01"

[[extensions]]
name = "Lines and shipping discount"
handle = "discount-lines-and-shipping"
type = "function"
description = "From a number of items in the cart: a percentage off every line and off shipping, one Function with two targets"

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart_lines_discounts_generate_run"

  [[extensions.targeting]]
  target = "cart.delivery-options.discounts.generate.run"
  input_query = "src/cart_delivery_options_discounts_generate_run.graphql"
  export = "cart_delivery_options_discounts_generate_run"

  [extensions.build]
  command = "../../../../tools/checkout/build_functions.sh ../.. discount-lines-and-shipping"
  path = "dist/function.wasm"
  watch = ["src/**/*.rs"]
