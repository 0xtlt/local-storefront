api_version = "2026-10"

[[extensions]]
name = "Partner price, from a server"
handle = "discount-network"
type = "function"
description = "Asks a server for the percentage to take off the order (network access: a .fetch target)"

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.fetch"
  input_query = "src/cart_lines_discounts_generate_fetch.graphql"
  export = "cart_lines_discounts_generate_fetch"

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart_lines_discounts_generate_run"

  [extensions.build]
  command = "../../../../tools/checkout/build_functions.sh ../.. discount-network"
  path = "dist/function.wasm"
  watch = ["src/**/*.rs"]
