# A checkout UI extension of the playground built from its sources: Shopify's template in Preact
# (`shopify app generate extension --template checkout_ui --flavor preact`), as it comes, but for
# the cart metafield it reads, declared below. lsf bundles it (`lsf app build ui-preact`,
# `--build`, `--watch`), without Node, into dist/ui-preact.js.
api_version = "2026-10"

[[extensions]]
name = "UI: Preact template"
handle = "ui-preact"
type = "ui_extension"
description = "Shopify's template in Preact: a banner and a checkbox that sets a cart metafield, which it declares, built by lsf."

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.block.render"

[extensions.capabilities]
api_access = true

# The checkbox reads `$app.requestedFreeGift` of the cart through `shopify.appMetafields`, which
# only has the metafields an extension declares: without this, the box does not stay ticked.
# `owner_type` is optional on 2026-10 and required from 2027-01.
[[extensions.metafields]]
namespace = "$app"
key = "requestedFreeGift"
owner_type = "CART"
