# A checkout UI extension of the playground built from its sources: Shopify's template in Preact
# (`shopify app generate extension --template checkout_ui --flavor preact`), as it comes. lsf
# bundles it (`lsf app build ui-preact`, `--build`, `--watch`), without Node, into
# dist/ui-preact.js.
api_version = "2026-10"

[[extensions]]
name = "UI: Preact template"
handle = "ui-preact"
type = "ui_extension"
description = "Shopify's template in Preact, as it comes: a banner and a checkbox that sets a cart metafield, built by lsf."

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.block.render"

[extensions.capabilities]
api_access = true
