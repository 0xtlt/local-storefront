api_version = "2026-10"

[[extensions]]
name = "Discount set by metafields"
handle = "discount-from-metafields"
type = "function"
description = "A percentage off the products flagged by a product metafield, with the percentage and label of a shop metafield"

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/run.graphql"
  export = "cart_lines_discounts_generate_run"

  [extensions.build]
  command = "../../../../tools/checkout/build_functions.sh ../.. discount-from-metafields"
  path = "dist/function.wasm"
  watch = ["src/**/*.rs"]
