api_version = "2027-01"

[[extensions]]
name = "Order routing"
handle = "listed-order-routing"
type = "function"
description = "An order routing location rule: listed by the local checkout, not run"

  [[extensions.targeting]]
  target = "cart.fulfillment-groups.location-rankings.generate.run"
  input_query = "src/run.graphql"
  export = "cart_fulfillment_groups_location_rankings_generate_run"

  [extensions.build]
  command = "../../../../tools/checkout/build_functions.sh ../.. listed-order-routing"
  path = "dist/function.wasm"
  watch = ["src/**/*.rs"]
