api_version = "2026-10"

[[extensions]]
name = "Broken: panics"
handle = "broken-panic"
type = "function"
description = "Panics: the Wasm module traps"

  [[extensions.targeting]]
  target = "cart.validations.generate.run"
  input_query = "src/run.graphql"
  export = "cart_validations_generate_run"

  [extensions.build]
  command = "../../../../tools/checkout/build_functions.sh ../.. broken-panic"
  path = "dist/function.wasm"
  watch = ["src/**/*.rs"]
