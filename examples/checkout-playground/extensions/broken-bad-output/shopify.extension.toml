api_version = "2026-10"

[[extensions]]
name = "Broken: output out of the schema"
handle = "broken-bad-output"
type = "function"
description = "Answers an operation the schema does not have"

  [[extensions.targeting]]
  target = "cart.delivery-options.transform.run"
  input_query = "src/run.graphql"
  export = "cart_delivery_options_transform_run"

  [extensions.build]
  command = "../../../../tools/checkout/build_functions.sh ../.. broken-bad-output"
  path = "dist/function.wasm"
  watch = ["src/**/*.rs"]
