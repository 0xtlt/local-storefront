# A checkout UI extension of the playground. Its bundle, dist/ui-broken-throws-on-event.js, is written by hand
# (no build step): read it for what the extension shows.
api_version = "2027-01"

[[extensions]]
name = "UI broken: throws-on-event"
handle = "ui-broken-throws-on-event"
type = "ui_extension"
description = "Renders, then throws in a click handler, rejects a promise, or throws in a signal subscriber."

  [[extensions.targeting]]
  target = "purchase.checkout.block.render"
