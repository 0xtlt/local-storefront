# A checkout UI extension of the playground. Its bundle, dist/ui-checkout-inspector.js, is written by hand
# (no build step): read it for what the extension shows.
api_version = "2026-10"

[[extensions]]
name = "UI: checkout inspector"
handle = "ui-checkout-inspector"
type = "ui_extension"
description = "Shows what the shopify global exposes: buyer, localization, cost, discounts, delivery, lines, attributes and more, live."

  [[extensions.targeting]]
  target = "purchase.checkout.block.render"

  [extensions.capabilities]
  api_access = true
