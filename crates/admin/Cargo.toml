[package]
name = "lsf-admin"
description = "A local Shopify Admin API (GraphQL, 2026-10) and the webhooks of an app, on local store data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lsf-core.workspace = true
lsf-checkout.workspace = true
# `serde`: the dates of the webhook log, in RFC 3339.
chrono = { workspace = true, features = ["serde"] }
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
# Parses the queries the Admin API is sent, and its schema.
graphql-parser = "0.4"
# `X-Shopify-Hmac-Sha256` of the webhooks, as lsf-core signs.
hmac = "0.13"
sha2 = "0.11"
# Delivers the webhooks, as lsf-checkout sends the requests of Functions: `http://localhost` needs
# no TLS, an `https` subscription the `rustls` lsf-checkout already builds.
ureq = { version = "3", default-features = false, features = ["rustls"] }
