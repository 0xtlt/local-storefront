[package]
name = "lsf-admin"
description = "A local Shopify Admin API (GraphQL, 2026-10) and the webhooks of an app, on local store data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lsf-core.workspace = true
lsf-checkout.workspace = true
# `serde`: the dates of the webhook log, in RFC 3339.
chrono = { workspace = true, features = ["serde"] }
chrono-tz.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
# The `regex` validation of metafield definitions (Shopify supports RE2, which `regex` follows).
regex.workspace = true
base64.workspace = true
# The HMACs Shopify signs OAuth redirects, session tokens and webhooks (`X-Shopify-Hmac-Sha256`)
# with, as lsf-core signs.
hmac = "0.13"
sha2 = "0.11"
# The query strings and form bodies of the OAuth endpoints.
form_urlencoded = "1"
# Parses the schema of the Admin API (its SDL). The queries have a parser of their own
# (`graphql::parse`), which keeps what graphql-ruby's errors report: see `docs/design.md`.
graphql-parser = "0.4"
# The schema is embedded compressed (`schemas/<version>/admin.graphql.br`).
brotli = { version = "9", default-features = false, features = ["std"] }
# Delivers the webhooks, as lsf-checkout sends the requests of Functions: `http://localhost` needs
# no TLS, an `https` subscription the `rustls` lsf-checkout already builds.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The app's extensions lsf-checkout does not read (web pixels, Flow triggers): their
# `shopify.extension.toml`, as lsf-checkout reads the others.
toml = "0.9"
# `OnlineStoreThemeFile.checksumMd5`, as lsf-core hashes theme assets.
md-5 = "0.11"
# The ZIP archive of a theme (`themeCreate`): its entries are deflated.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# The storefront renders what the Admin API changed, in the sync tests (`tests/sync.rs`).
lsf-theme.workspace = true
