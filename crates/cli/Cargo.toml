[package]
name = "lsf"
description = "Serve a Shopify theme locally, rendered from JSON fixtures instead of the Shopify API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lsf"
path = "src/main.rs"

[dependencies]
lsf-core.workspace = true
lsf-liquid.workspace = true
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
mimalloc = "0.1"
brotli = { version = "8", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
multer = "3"
form_urlencoded = "1"
percent-encoding = "2"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
indexmap.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
