[package]
name = "lsf-checkout"
description = "A local Shopify checkout: runs the Shopify Functions and checkout UI extensions of an app against local store data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lsf-core.workspace = true
indexmap.workspace = true
serde.workspace = true
# `arbitrary_precision`: a number of the input reaches the Function as written, as
# function-runner passes it.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
chrono.workspace = true

# The runner: what Shopify's function-runner v9.2.2 (the engine behind `shopify app function
# run`) does to run a module (`src/runner/host.rs`), with the wasmtime, WASI and MessagePack it
# runs it with. Only what lsf runs Functions with: Cranelift for the machine lsf runs on, and
# wasmtime's compilation cache.
wasmtime = { version = "=39.0.1", default-features = false, features = ["runtime", "cranelift", "std", "cache", "parallel-compilation"] }
wasmtime-wasi = { version = "=39.0.1", default-features = false, features = ["p1"] }
deterministic-wasi-ctx = "=3.0.4"
rmp-serde = "1.3"
toml = "0.9"
# What `shopify app build` does to a Rust Function's module after its build command: Shopify's
# own shopify-function-trampoline (MIT), as a library, at the version Shopify's CLI runs, on the
# walrus and wasmparser wasmtime has (`vendor/shopify_function_trampoline`).
shopify_function_trampoline = { path = "../../vendor/shopify_function_trampoline" }
wasmparser = "0.240"
# The build of JavaScript Functions (`javascript`): the module Javy writes, and the source it
# embeds, compressed as Javy does.
wasm-encoder = "0.240"
oxc = { workspace = true, features = ["ast_visit", "codegen", "minifier", "semantic", "transformer"] }
brotli = { version = "9", default-features = false, features = ["std"] }
# Parses the input queries of Functions.
graphql-parser = "0.4"
# Network access for Functions: the requests of the `.fetch` targets. `rustls` is the one ureq
# already uses; it is named here to tell its errors from other I/O errors.
rustls = { version = "0.23", default-features = false, features = ["std"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
# The modules of the tests, written as text.
wasmtime = { version = "=39.0.1", default-features = false, features = ["wat"] }
# The SHA-256 of what graphql-codegen wrote, in the typegen tests.
sha2 = "0.11"
