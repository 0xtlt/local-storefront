[package]
name = "lsf-checkout"
description = "A local Shopify checkout: runs the Shopify Functions and checkout UI extensions of an app against local store data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lsf-core.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

# The runner: Shopify's own function-runner (the engine behind `shopify app function run`), used
# as a library. wasmtime is pinned to the version it pins.
function-runner = { git = "https://github.com/Shopify/function-runner", tag = "v9.2.2" }
wasmtime = { version = "=39.0.1", default-features = false, features = ["runtime", "cranelift", "std"] }
toml = "0.9"
# Parses the input queries of Functions.
graphql-parser = "0.4"
