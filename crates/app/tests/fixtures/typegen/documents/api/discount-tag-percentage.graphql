# $tags and $collections come from the settings of the discount ([extensions.input.variables]).
query Input($tags: [String!]!, $collections: [ID!]!) {
  cart {
    lines {
      id
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            title
            hasAnyTag(tags: $tags)
            inAnyCollection(ids: $collections)
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:config", key: "settings") {
      value
    }
  }
}
