"""
An earning event representing when a partner receives payment.
"""
type Earning implements PartnerEvent {
  """
  References the charge ID from the related charge event.
  """
  chargeId: ID
  """
  Description of the earning.
  """
  description: String
  """
  The type of earning.
  """
  earningType: EarningType!
  """
  The type of event.
  """
  eventType: EventType!
  """
  The amount the merchant was charged.
  """
  grossAmount: Money!
  """
  Unique identifier for the event.
  """
  id: ID!
  """
  Additional metadata for backfilled earnings.
  """
  metadata: EventMetadata
  """
  The amount the partner receives after commission.
  """
  netAmount: Money!
  """
  The date and time when the event occurred.
  """
  occurredAt: DateTime!
  """
  The date when the earning was settled.
  """
  settlementDate: Date
  """
  The shop associated with the event.
  """
  shop: ShopReference
  """
  Shopify's commission.
  """
  shopifyFee: Money!
  """
  The subject of the event (App or Theme).
  """
  subject: Subject
}

"""
The type of earning.
"""
enum EarningType {
  """
  Earning adjustment.
  """
  ADJUSTMENT
  """
  Earning from a charge.
  """
  CHARGE
  """
  Earning from credit.
  """
  CREDIT
  """
  Earning refund.
  """
  REFUND
}

"""
Filter criteria for historical events.
"""
input EventFilterInput {
  """
  Filter events by one or more event types.
  """
  eventTypes: [EventType!]
  """
  Filter events that occurred on or before this date. If only this is provided,
  occurred_at_min defaults to this date - 30 days. Defaults to now if neither
  date is provided. Maximum range between occurred_at_min and occurred_at_max is 365 days.
  """
  occurredAtMax: DateTime
  """
  Filter events that occurred on or after this date. If only this is provided,
  occurred_at_max defaults to the earlier of this date + 30 days or now.
  Defaults to 30 days ago if neither date is provided. Maximum range between
  occurred_at_min and occurred_at_max is 365 days.
  """
  occurredAtMin: DateTime
  """
  Filter events by shop ID. Example value: `gid://shopify/Shop/1234`.
  """
  shopId: ID
  """
  Filter events by subject ID. Example value: `gid://shopify/App/1234`.
  """
  subjectId: ID
  """
  Filter events by subject type (APP or THEME).
  """
  subjectType: SubjectType
}

