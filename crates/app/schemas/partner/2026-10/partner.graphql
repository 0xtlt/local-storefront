"""
The schema's entry-point for mutations. This acts as the public, top-level API from which all mutations must start.
"""
type MutationRoot {
  """
  Allows an app to create a credit for a shop that can be used towards future
  app purchases. This mutation is only available to Partner API clients that
  have been granted the `View financials` permission.
  """
  appCreditCreate(
    """
    The amount that can be used towards future app purchases in Shopify.
    """
    amount: MoneyInput!
    """
    The id of the app to associate the credit with. Example value: `gid://partners/App/123`.
    """
    appId: ID!
    """
    The description of the app credit.
    """
    description: String!
    """
    The id of the shop to be credited. Example value: `gid://partners/Shop/456`.
    """
    shopId: ID!
    """
    Specifies whether the app credit is a test transaction.
    """
    test: Boolean = false
  ): AppCreditCreatePayload
  """
  Cancels an app subscription.
  """
  appSubscriptionCancel(
    """
    The id of the app. Example value: `gid://shopify/App/123`.
    """
    appId: ID!
    """
    Whether to defer cancellation until the end of the current billing cycle.
    """
    deferCancellation: Boolean!
    """
    Whether to issue prorated credits for the unused portion of the
    subscription. Cannot be used together with `skipFinalUsageCharge`.
    """
    prorate: Boolean!
    """
    The id of the shop. Example value: `gid://shopify/Shop/456`.
    """
    shopId: ID!
    """
    Whether to skip the final usage charge when cancelling. Only applicable to
    usage-billed subscriptions. Cannot be used together with `prorate`.
    """
    skipFinalUsageCharge: Boolean!
  ): AppSubscriptionCancelPayload
}

