A Shopify Partner transaction.
"""
interface Transaction {
  """
  The date and time when the transaction was recorded.
  """
  createdAt: DateTime!
  """
  The transaction ID.
  """
  id: ID!
}

"""
The connection type for Transaction.
"""
type TransactionConnection {
  """
  A list of edges.
  """
  edges: [TransactionEdge!]!
  """
  Information about pagination in a connection.
  """
  pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type TransactionEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!
  """
  The item at the end of the edge.
  """
  node: Transaction!
}

"""
The type of transaction.
"""
enum TransactionType {
  """
  A transaction corresponding to a one-time app charge.
  """
  APP_ONE_TIME_SALE
  """
  A transaction corresponding to a refund, downgrade, or adjustment of an app charge.
  """
  APP_SALE_ADJUSTMENT
  """
  A transaction corresponding to an [app credit](/docs/admin-api/rest/reference/billing/applicationcredit).
  """
  APP_SALE_CREDIT
  """
  A transaction corresponding to an app subscription charge.
  """
  APP_SUBSCRIPTION_SALE
  """
  A transaction corresponding to an app usage charge.
  """
  APP_USAGE_SALE
  """
  A transaction of a type that is no longer supported.
  """
  LEGACY
  """
  A transaction corresponding to a shop referral.
  """
  REFERRAL
  """
  A transaction corresponding to a shop referral adjustment.
  """
  REFERRAL_ADJUSTMENT
  """
  A transaction corresponding to a paid invoice for a service.
  """
  SERVICE_SALE
  """
  A transaction corresponding to a refund, downgrade, or adjustment of a service sale.
  """
  SERVICE_SALE_ADJUSTMENT
  """
  Tax transactions are not computed for pending transactions. Instead, they're rolled
  up as one transaction per payout. The type of tax and the way it's
  computed is dependent on the type of transaction.

  For sale transactions, such as app subscriptions or theme purchases, Shopify charges
  the Partner tax on the fee collected for brokering the transaction. The amount is
  a negative number in this scenario.

  For referral transactions, such as a development store transfer, Shopify pays the Partner
  a commission. The tax represents any taxes on the referral commission that are payable to
  the Partner. The amount is a positive number in this scenario.
  """
  TAX
  """
  A transaction corresponding to a theme purchase.
  """
  THEME_SALE
  """
  A transaction corresponding to a refund, downgrade, or adjustment of a theme sale.
  """
  THEME_SALE_ADJUSTMENT
}

"""
A valid URL, transported as a string.
"""
scalar Url

"""
Usage information for the current billing cycle.
"""
type Usage {
  """
  The calculated cost of the current billing cycle.
  """
  cost: Money!
  """
  The quantity of usage for the current billing cycle.
  """
  quantity: Float!
}

"""
An event that marks that an app usage charge was applied.
"""
type UsageChargeApplied implements AppEvent & AppUsageRecordEvent {
  """
  A Shopify [app](/docs/apps/build).
  """
  app: App!
  """
  An app charge. This charge varies based on how much the merchant uses the app
  or a service that the app integrates with.
  """
  charge: AppUsageRecord!
  """
  The date and time when the event took place.
  """
  occurredAt: DateTime!
  """
  A Shopify shop.
  """
  shop: Shop!
  """
  The type of app event.
  """
  type: AppEventTypes!
}

"""
Represents an error in a mutation.
"""
type UserError {
  """
  The path to the input field that caused the error.
  """
  field: [String!]
  """
  The error message.
  """
  message: String!
}
