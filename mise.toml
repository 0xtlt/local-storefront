# Toolchain + tasks for local-storefront. Run `mise install` once, then `mise run <task>`.
[tools]
rust = { version = "1.99.1", components = "clippy,rustfmt" }
# For the npm packaging (`npm/`), the tests of the injected scripts, and `mise run prettier:*`
# (differential tests of `lsf fmt` against Prettier with Shopify's Liquid plugin).
node = "26.12.1"
# Only needed for `mise run oracle:*` (differential tests against Shopify's reference Liquid gem)
# and for the tasks that download test material (`docs:fetch`, `liquid-spec:fetch`).
ruby = "3.4.11"

[env]
LSF_HORIZON_DIR = "{{config_root}}/themes/horizon"

[tasks.build]
description = "Build the lsf binary (release)"
run = "cargo build --release -p lsf-cli"

[tasks.install]
description = "Build lsf and install it into ~/.cargo/bin"
run = "cargo install --path crates/cli --locked"

[tasks."npm:first-publish"]
description = "Publish the npm packages of a release from this machine and let GitHub Actions publish the next ones (once per new package)"
run = "npm/first-publish.sh"
# npm asks for two-factor authentication: it needs the terminal.
raw = true

[tasks."release:notes"]
description = "Print what the GitHub release of a version will say: its section of CHANGELOG.md"
run = "tools/release/notes.sh"

[tasks.test]
description = "Run the whole test suite"
depends = ["test:js"]
run = "cargo test --workspace"

[tasks."test:js"]
description = "Test the scripts lsf injects into pages (Shopify.actions, Shopify.loadFeatures, live reload) and the checkout page and its extension host"
run = "node --test crates/theme/assets/platform/tests/*.test.mjs crates/cli/assets/tests/*.test.mjs crates/app/assets/tests/*.test.mjs"

[tasks.lint]
description = "Clippy on the whole workspace, warnings are errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."checkout:schemas"]
description = "Regenerate the Function API schemas of lsf-app (crates/app/schemas/functions) from the pinned @shopify/dev-mcp package"
run = "node tools/checkout/function_schemas.mjs"

[tasks."admin:e2e"]
description = "Run examples/admin-backend, an app backend written with Shopify's libraries, end to end against lsf's Admin API"
dir = "examples/admin-backend"
run = [
  "cargo build --manifest-path ../../Cargo.toml -p lsf-cli",
  "npm install --no-audit --no-fund",
  # The headless Chromium of the Polaris checks: nothing to do once it is there.
  "npx playwright-core install --only-shell --no-remove chromium",
  "npm run e2e",
]

[tasks."admin:bench"]
description = "Measure the RAM and CPU of a release build of lsf, suite by suite (startup, storefront, admin, growth, shops, webhooks, sync): mise run admin:bench -- admin --bin target/release/lsf"
run = "node tools/admin/bench.mjs"

[tasks."admin:version"]
description = "Write everything a version of the Admin API needs (crates/app/schemas/admin/<version>, its test fixtures) from the pinned @shopify/dev-mcp package, or shopify.dev for a version it lacks, and print what is left to do: mise run admin:version -- 2027-01"
run = "node tools/admin/add_version.mjs"

[tasks."admin:schema"]
description = "Regenerate the schema of a version of the GraphQL Admin API of lsf-app (crates/app/schemas/admin/<version>) from the pinned @shopify/dev-mcp package: mise run admin:schema [-- --version 2027-01]"
run = "node tools/admin/admin_schema.mjs"

[tasks."admin:access-scopes"]
description = "Regenerate the access scopes and the search filters of a version of the Admin API (crates/app/schemas/admin/<version>/access.json, search.json) from the pinned @shopify/dev-mcp package: mise run admin:access-scopes [-- --version 2027-01]"
run = "node tools/admin/access_scopes.mjs"

[tasks."admin:topics"]
description = "Regenerate the webhook topics of a version of the Admin API (crates/app/schemas/admin/<version>/topics.json) from the pinned @shopify/dev-mcp package: mise run admin:topics [-- --version 2027-01]"
run = "node tools/admin/webhook_topics.mjs"

[tasks."admin:webhook-examples"]
description = "Download Shopify's example webhook payloads of a version (crates/app/tests/fixtures/webhooks/examples-<version>.json), which the payload tests compare with: mise run admin:webhook-examples [-- --version 2027-01]"
run = "node tools/admin/webhook_examples.mjs"

[tasks."checkout:packages"]
description = "Copy the npm packages lsf builds extensions with when an app has no node_modules (crates/app/javascript-packages), at the versions of tools/checkout/javascript_packages.mjs"
run = "node tools/checkout/javascript_packages.mjs"

[tasks."checkout:providers"]
description = "Rebuild the providers lsf links Functions with (crates/app/providers) from those of Shopify's function-runner, at the tag of tools/checkout/providers.sh"
run = "tools/checkout/providers.sh"

[tasks."fixtures:functions"]
description = "Rebuild the Wasm Functions of the lsf-app test app (crates/app/tests/fixtures/app); the built modules are committed"
run = "tools/checkout/build_function_fixtures.sh"

[tasks."playground:functions"]
description = "Rebuild the Wasm Functions of the checkout playground (examples/checkout-playground); the built modules are committed"
run = "tools/checkout/build_functions.sh examples/checkout-playground"

[tasks."playground:api"]
description = "Start the mock server the network Functions of the checkout playground call (http://localhost:8787)"
run = "node examples/checkout-playground/tools/fake-api.mjs"

[tasks."playground:checkout"]
description = "Serve the checkout of the playground app with its scenarios (http://127.0.0.1:9292/)"
dir = "examples/checkout-playground"
run = "cargo run --release --manifest-path ../../Cargo.toml -p lsf-cli -- app dev --app ."

[tasks."playground:dev"]
description = "Serve the checkout of the playground in watch mode: a Function builds again when its files change, and the open pages reload (http://127.0.0.1:9292/)"
dir = "examples/checkout-playground"
run = "cargo run --release --manifest-path ../../Cargo.toml -p lsf-cli -- app dev --app . --watch"

[tasks.fmt]
description = "Format the code"
run = "cargo fmt --all"

[tasks.check]
description = "fmt check + clippy + tests"
depends = ["lint", "test"]
run = "cargo fmt --all -- --check"

[tasks."docs:site"]
description = "Serve the documentation site (the guides of docs/, rendered by VitePress) at http://localhost:5173, reloading as they change"
dir = "tools/docs-site"
run = "npm install --silent && npx vitepress dev"

[tasks."docs:site:build"]
description = "Build the documentation site into tools/docs-site/.vitepress/dist; fails on a link to a page that does not exist"
dir = "tools/docs-site"
run = "npm install --silent && npx vitepress build"

[tasks."horizon:install"]
description = "Clone (or update) Shopify's Horizon theme into themes/horizon"
run = """
if [ -d themes/horizon/.git ]; then
  git -C themes/horizon pull --ff-only
else
  git clone --depth 1 https://github.com/Shopify/horizon.git themes/horizon
fi
"""

[tasks."horizon:serve"]
description = "Serve the Horizon theme with the demo store data"
depends = ["horizon:install"]
run = "cargo run --release -p lsf-cli -- serve --theme themes/horizon"

[tasks."oracle:install"]
description = "Install Shopify's reference liquid gem locally (used to generate golden tests)"
run = "GEM_HOME=$PWD/.oracle/gems gem install liquid --no-document"

[tasks."oracle:golden"]
description = "Regenerate crates/liquid/tests/golden/*.json from the reference liquid gem"
run = "GEM_HOME=$PWD/.oracle/gems ruby tools/oracle/generate_golden.rb"

[tasks."oracle:strict2-fixes"]
description = "Check with the reference liquid gem that the fixes `lsf check --fix` makes for liquid-spec's templates render what the originals render today"
run = """
fixes="$(mktemp)"
STRICT2_SPEC_FIXES="$fixes" cargo test -q -p lsf-liquid --test strict2_spec
GEM_HOME=$PWD/.oracle/gems ruby tools/oracle/check_strict2_fixes.rb "$fixes"
"""

[tasks."prettier:install"]
description = "Install Prettier and Shopify's Liquid plugin locally (the reference `lsf fmt` is compared with)"
run = """
mkdir -p .oracle/prettier
cp tools/prettier/package.json .oracle/prettier/
npm install --prefix .oracle/prettier --no-audit --no-fund
"""

[tasks."prettier:golden"]
description = "Regenerate crates/fmt/tests/golden/*.json from Prettier with the Liquid plugin"
run = "node tools/prettier/generate_golden.mjs"

[tasks."prettier:fixtures"]
description = "Download the tests of Shopify's Prettier plugin into .cache/ and have Prettier format them (run by the lsf-fmt tests when present)"
run = "tools/prettier/fetch_fixtures.sh"

[tasks."prettier:compare"]
description = "Compare `lsf fmt` with Prettier on the Liquid files of a directory, without writing to it: mise run prettier:compare -- <directory> [options as JSON]"
depends = ["build"]
run = "node tools/prettier/compare.mjs"

[tasks."docs:fetch"]
description = "Download Shopify's Liquid reference (objects/filters/tags + example outputs) into .cache/"
run = "tools/docs/fetch.sh"

[tasks."docs:coverage"]
description = "Check lsf against Shopify's Liquid reference: fails on a missing filter or tag, lists object properties to look at (run docs:fetch first)"
run = [
  "cargo test -q -p lsf-theme --test conformance every_documented_filter_and_tag_exists",
  "ruby tools/docs/coverage.rb",
]

[tasks."liquid-spec:fetch"]
description = "Download Shopify's liquid-spec test suite into .cache/ (run by the lsf-liquid tests when present)"
run = "tools/liquid-spec/fetch.sh"
