[workspace]
resolver = "3"
members = ["crates/liquid", "crates/core", "crates/cli"]

[workspace.package]
version = "0.1.8"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/0xtlt/local-storefront"

[workspace.dependencies]
lsf-liquid = { path = "crates/liquid" }
lsf-core = { path = "crates/core" }

base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: without it a number such as 1234.3838300038383 is read one bit off.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
