name: npm

# Publishes the npm packages of a release, from the archives attached to it. release.yml
# starts it after publishing a release; it can also be run by hand, for a release made before
# npm publishing was enabled or after a publication that failed.
#
# This is the workflow npm trusts ("trusted publishing"): each package on npmjs.com names this
# repository and this file as its publisher, so no token is stored anywhere. A package has to
# exist before it can be configured that way: npm/first-publish.sh takes care of the first time.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release to publish, e.g. v0.1.1
        required: true
        type: string
      publish:
        description: Publish to npm (untick to only assemble and try the packages)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  npm:
    name: npm packages of ${{ inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # What lets npm recognise this workflow as the trusted publisher of the packages.
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download the archives of the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::\"$TAG\" is not a release tag (expected vX.Y.Z)"; exit 1 ;;
          esac
          gh release download "$TAG" --dir dist --pattern 'lsf-*' --pattern SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/npm-packages
        env:
          # Only as a fallback: left unset, npm authenticates as the trusted publisher.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          artifacts: dist
          version: ${{ steps.release.outputs.version }}
          publish: ${{ inputs.publish }}
