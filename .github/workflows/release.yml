name: Release

# Pushing a tag `vX.Y.Z` tests the code, builds `slt` for every platform and publishes a GitHub
# release with one archive per platform and their checksums.
#
# Running the workflow by hand ("Run workflow") does the same without publishing: the archives
# are kept as artifacts of the run. Use it to try the builds before tagging.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust

      - name: Check that the tag is the version of the crate
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "slt") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=Cargo.toml::the tag $GITHUB_REF_NAME does not match the version $version"
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is cross-compiled with Zig, which lets the glibc builds target glibc 2.17
          # (they run on any distribution since CentOS 7) whatever the runner has. The musl
          # builds are fully static, for Alpine and scratch containers.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            zig: x86_64-unknown-linux-gnu.2.17
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            zig: aarch64-unknown-linux-gnu.2.17
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: x86_64-unknown-linux-musl
            smoke: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: aarch64-unknown-linux-musl
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            smoke: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    env:
      TARGET: ${{ matrix.target }}
      ZIG_TARGET: ${{ matrix.zig }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.zig
        with:
          python-version: "3.13"
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: pip install cargo-zigbuild==0.23.4 ziglang==0.16.0

      - name: Build
        run: |
          if [ -n "$ZIG_TARGET" ]; then
            cargo zigbuild --release --locked -p slt --target "$ZIG_TARGET"
          else
            cargo build --release --locked -p slt --target "$TARGET"
          fi

      # Only where the runner can execute what it built.
      - name: Smoke test
        if: matrix.smoke
        run: |
          slt="target/$TARGET/release/slt"
          "$slt" --version
          "$slt" --theme crates/core/tests/fixtures/theme validate
          # The home page: a path argument starting with `/` would be rewritten by Git Bash
          # on Windows.
          "$slt" --theme crates/core/tests/fixtures/theme render --strict > /dev/null

      - name: Package
        run: |
          mkdir dist
          cd "target/$TARGET/release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "../../../dist/slt-$TARGET.zip" slt.exe
          else
            tar -czf "../../../dist/slt-$TARGET.tar.gz" slt
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: slt-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum slt-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run of a release that already exists replaces its files.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          # `v1.2.0-rc.1` and the like are prereleases.
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG" "${flags[@]}"
