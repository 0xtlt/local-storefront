name: Release

# Pushing a tag `vX.Y.Z` tests the code, builds `lsf` for every platform and publishes a GitHub
# release with one archive per platform and their checksums. The release says what
# CHANGELOG.md says of that version.
#
# When the repository variable NPM_PUBLISH is `true`, the tag then starts npm.yml, which
# publishes the npm packages of the new release (`local-storefront` and one per platform).
#
# Running the workflow by hand ("Run workflow") does the same without publishing: the archives
# are kept as artifacts of the run, and the npm packages are assembled and tried. Use it to try
# the builds before tagging.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust

      - name: Check that the tag is the version of the crate
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "lsf") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=Cargo.toml::the tag $GITHUB_REF_NAME does not match the version $version"
            exit 1
          fi

      # Before anything is built: its section is what the release will say.
      - name: Check that the changelog has the version
        if: github.ref_type == 'tag'
        run: |
          if ! tools/release/notes.sh "$GITHUB_REF_NAME"; then
            echo "::error file=CHANGELOG.md::the changelog has no section for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked

      - name: Test the injected scripts
        # The files are listed by the shell: older versions of Node do not take a directory.
        run: node --test crates/core/assets/platform/tests/*.test.mjs crates/cli/assets/tests/*.test.mjs

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is cross-compiled with Zig, which lets the glibc builds target glibc 2.17
          # (they run on any distribution since CentOS 7) whatever the runner has. The musl
          # builds are fully static, for Alpine and scratch containers.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            zig: x86_64-unknown-linux-gnu.2.17
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            zig: aarch64-unknown-linux-gnu.2.17
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: x86_64-unknown-linux-musl
            smoke: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: aarch64-unknown-linux-musl
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            smoke: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    env:
      TARGET: ${{ matrix.target }}
      ZIG_TARGET: ${{ matrix.zig }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.zig
        with:
          python-version: "3.13"
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: pip install cargo-zigbuild==0.23.4 ziglang==0.16.0

      - name: Build
        run: |
          if [ -n "$ZIG_TARGET" ]; then
            cargo zigbuild --release --locked -p lsf --target "$ZIG_TARGET"
          else
            cargo build --release --locked -p lsf --target "$TARGET"
          fi

      # Only where the runner can execute what it built.
      - name: Smoke test
        if: matrix.smoke
        run: |
          lsf="target/$TARGET/release/lsf"
          "$lsf" --version
          "$lsf" --theme crates/core/tests/fixtures/theme validate
          # The home page: a path argument starting with `/` would be rewritten by Git Bash
          # on Windows.
          "$lsf" --theme crates/core/tests/fixtures/theme render --strict > /dev/null

      - name: Package
        run: |
          mkdir dist
          cd "target/$TARGET/release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "../../../dist/lsf-$TARGET.zip" lsf.exe
          else
            tar -czf "../../../dist/lsf-$TARGET.tar.gz" lsf
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lsf-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: [build, npm]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To start npm.yml.
      actions: write
    steps:
      # For the changelog.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: lsf-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum lsf-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run of a release that already exists replaces its files.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          # `v1.2.0-rc.1` and the like are prereleases.
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          # What the changelog says of the version, then the link to the commits that GitHub
          # writes. Without pull requests, that link is all GitHub has to say.
          {
            tools/release/notes.sh "$TAG"
            echo
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG" "${flags[@]}"

      # npm.yml is the one workflow npm trusts to publish, so it is started rather than called.
      - name: Publish the npm packages
        if: vars.NPM_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run npm.yml --ref "$BRANCH" -f tag="$TAG"

  # The packages are published by npm.yml, from the archives of the release. This job only
  # checks, on every run, that they can be assembled and that they work once installed.
  npm:
    name: npm packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: lsf-*
          merge-multiple: true

      - name: Read the version
        id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[workspace.dependencies\]/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/npm-packages
        with:
          artifacts: dist
          version: ${{ steps.version.outputs.version }}
